<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#skyGrad)" />
  <!-- Horizon line -->
  <path d="M8 42 C20 40, 44 40, 56 42" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <!-- Rising sun -->
  <circle cx="32" cy="40" r="14" fill="url(#sunGrad)" filter="url(#glow)" />
  <!-- Sun rays -->
  <path d="M32 20 L32 16" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M20 25 L17 22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M44 25 L47 22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <!-- Water/Foreground waves -->
  <path d="M12 48 C20 46, 28 50, 36 47 C44 44, 48 48, 52 47" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Stylized 'A' silhouette -->
  <path d="M32 26 L23 44 L27 44 L29 40 L35 40 L37 44 L41 44 Z M32 33 L30.2 37 L33.8 37 Z" fill="#ffffff" />
</svg>
